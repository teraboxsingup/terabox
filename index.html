<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeraBox 数据仪表板</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, "Microsoft YaHei", sans-serif;
            background: #f3f6fc;
            color: #1e293b;
            min-height: 100vh;
        }

        /* 页眉和标志 */
        header {
            background: #ffffff;
            padding: 25px 20px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.05);
        }

        .logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
            border-radius: 20px;
        }

        /* 主仪表板 */
        .container {
            width: 90%;
            max-width: 850px;
            margin: 35px auto;
        }

        .page-title {
            font-size: 25px;
            margin-bottom: 25px;
            text-align: center;
            color: #1e293b;
        }

        /* 数据卡片 */
        .dashboard {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            width: 100%;
            padding: 25px 28px;
            border-radius: 16px;
            transition: 0.25s;
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        /* 红色点击量卡片 */
        .clicks-card {
            background: #fff0f0;
            border: 1px solid #fecaca;
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.07);
        }

        /* 红色下载量卡片 */
        .downloads-card {
            background: #ffe8e8;
            border: 1px solid #fca5a5;
            box-shadow: 0 5px 20px rgba(220, 38, 38, 0.07);
        }

        /* 绿色收益卡片 */
        .earnings-card {
            background: #eafaf0;
            border: 1px solid #a7f3c0;
            box-shadow: 0 5px 20px rgba(22, 163, 74, 0.07);
        }

        .card-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .icon {
            width: 55px;
            height: 55px;
            min-width: 55px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .clicks-icon {
            background: #fecaca;
        }

        .downloads-icon {
            background: #fca5a5;
        }

        .earnings-icon {
            background: #bbf7d0;
        }

        .card h2 {
            font-size: 17px;
            color: #475569;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .number {
            font-size: 29px;
            font-weight: bold;
            color: #172033;
        }

        /* 每日更新时间 */
        .daily-update {
            margin-top: 25px;
            padding: 14px 18px;
            text-align: center;
            background: #fff0f0;
            border: 1px solid #fecaca;
            border-radius: 12px;
            color: #dc2626;
            font-size: 15px;
            font-weight: bold;
        }

        /* 页脚 */
        footer {
            text-align: center;
            padding: 15px 15px 25px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* 移动设备适配 */
        @media (max-width: 500px) {
            header {
                padding: 22px 15px;
            }

            .logo {
                width: 85px;
                height: 85px;
            }

            .container {
                width: 92%;
                margin: 28px auto;
            }

            .page-title {
                font-size: 22px;
            }

            .card {
                padding: 21px 17px;
            }

            .left-section {
                gap: 12px;
            }

            .icon {
                width: 46px;
                height: 46px;
                min-width: 46px;
                font-size: 22px;
            }

            .card h2 {
                font-size: 14px;
            }

            .number {
                font-size: 24px;
            }

            .daily-update {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- TeraBox 标志 -->
    <header>
        <img
            src="https://www.image2url.com/r2/default/images/1793657800000-029f4a91-e6e7-4719-b49c-dc2f6cd6f6fd.png"
            alt="TeraBox 标志"
            class="logo"
        >
    </header>

    <!-- 数据仪表板 -->
    <main class="container">

        <h1 class="page-title">TeraBox 数据仪表板</h1>

        <div class="dashboard">

            <!-- 总点击量 -->
            <section class="card clicks-card" id="clicks">
                <div class="card-content">
                    <div class="left-section">
                        <div class="icon clicks-icon">👆</div>

                        <div>
                            <h2>总点击量</h2>
                            <div class="number" id="clickCount">12450</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 总下载量 -->
            <section class="card downloads-card" id="downloads">
                <div class="card-content">
                    <div class="left-section">
                        <div class="icon downloads-icon">📥</div>

                        <div>
                            <h2>总下载量</h2>
                            <div class="number" id="downloadCount">3280</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 总收益 -->
            <section class="card earnings-card" id="earnings">
                <div class="card-content">
                    <div class="left-section">
                        <div class="icon earnings-icon">💰</div>

                        <div>
                            <h2>总收益</h2>
                            <div class="number" id="earningCount">₹8750</div>
                        </div>
                    </div>
                </div>
            </section>

        </div>

        <!-- 每日更新时间 -->
        <div class="daily-update">
            每日更新时间：下午 4 点至 6 点
        </div>

    </main>

    <!-- 页脚 -->
    <footer>
        &copy; 2026 TeraBox 数据仪表板
    </footer>

    <script>
        // 在这里修改仪表板数据
        const dashboardData = {
            clicks: 12450,
            downloads: 3280,
            earnings: 8750
        };

        // 显示不带逗号的数字
        document.getElementById("clickCount").textContent =
            dashboardData.clicks;

        document.getElementById("downloadCount").textContent =
            dashboardData.downloads;

        document.getElementById("earningCount").textContent =
            "₹" + dashboardData.earnings;
    </script>

</body>
</html>
