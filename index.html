<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeraBox 数据仪表板</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    color: white;
    background: linear-gradient(135deg, #4338ca, #9333ea, #ec4899);
}

header {
    text-align: center;
    padding: 22px 15px 10px;
}

.logo {
    width: 85px;
    height: 85px;
    object-fit: contain;
    background: white;
    border-radius: 20px;
    padding: 4px;
    box-shadow: 0 8px 25px #24145044;
}

.container {
    width: 100%;
    max-width: 1000px;
    min-height: calc(100vh - 155px);
    margin: auto;
    padding: 20px 25px 30px;
}

.page-title {
    text-align: center;
    font-size: clamp(27px, 4vw, 38px);
    margin-bottom: 28px;
    font-weight: 800;
}

.dashboard {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

.card {
    width: 100%;
    min-height: 190px;
    padding: 30px;
    border-radius: 24px;
    display: flex;
    align-items: center;
    box-shadow: 0 12px 30px #24145033;
    border: 1px solid #ffffff55;
    transition: transform 0.25s;
}

.card:hover {
    transform: translateY(-4px);
}

.clicks-card {
    background: linear-gradient(120deg, #fb7185, #dc2626);
}

.downloads-card {
    background: linear-gradient(120deg, #f87171, #be123c);
}

.earnings-card {
    background: linear-gradient(120deg, #4ade80, #15803d);
}

.card-content {
    display: flex;
    align-items: center;
    gap: 25px;
}

.icon {
    width: 75px;
    height: 75px;
    min-width: 75px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 38px;
    border-radius: 22px;
    background: #ffffff33;
    border: 1px solid #ffffff55;
}

.card h2 {
    font-size: clamp(18px, 2.5vw, 23px);
    margin-bottom: 14px;
    font-weight: 600;
}

.number {
    font-size: clamp(32px, 4vw, 43px);
    font-weight: 800;
    overflow-wrap: anywhere;
}

.daily-update {
    margin-top: 28px;
    padding: 18px 12px;
    text-align: center;
    border-radius: 15px;
    background: #fff1f2;
    color: #dc2626;
    border: 2px solid #fecaca;
    font-size: 16px;
    font-weight: bold;
    box-shadow: 0 8px 24px #24145022;
}

footer {
    text-align: center;
    padding: 18px 12px 24px;
    font-size: 13px;
    color: #ffffffd9;
}

@media (max-width: 600px) {
    header {
        padding-top: 18px;
    }

    .logo {
        width: 72px;
        height: 72px;
    }

    .container {
        padding: 20px 15px 25px;
    }

    .page-title {
        margin-bottom: 24px;
        font-size: 26px;
    }

    .dashboard {
        gap: 18px;
    }

    .card {
        min-height: 165px;
        padding: 24px 18px;
        border-radius: 21px;
    }

    .card-content {
        gap: 17px;
    }

    .icon {
        width: 60px;
        height: 60px;
        min-width: 60px;
        font-size: 30px;
        border-radius: 17px;
    }

    .card h2 {
        font-size: 17px;
        margin-bottom: 10px;
    }

    .number {
        font-size: 31px;
    }

    .daily-update {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<header>
    <img
        src="https://www.image2url.com/r2/default/images/1793657800000-029f4a91-e6e7-4719-b49c-dc2f6cd6f6fd.png"
        alt="TeraBox 标志"
        class="logo"
    >
</header>

<main class="container">

    <h1 class="page-title">TeraBox 数据仪表板</h1>

    <div class="dashboard">

        <section class="card clicks-card">
            <div class="card-content">
                <div class="icon">👆</div>
                <div>
                    <h2>总点击量</h2>
                    <div class="number" id="clickCount">12450</div>
                </div>
            </div>
        </section>

        <section class="card downloads-card">
            <div class="card-content">
                <div class="icon">📥</div>
                <div>
                    <h2>总下载量</h2>
                    <div class="number" id="downloadCount">3280</div>
                </div>
            </div>
        </section>

        <section class="card earnings-card">
            <div class="card-content">
                <div class="icon">💰</div>
                <div>
                    <h2>总收益</h2>
                    <div class="number" id="earningCount">₹8750</div>
                </div>
            </div>
        </section>

    </div>

    <div class="daily-update">
        每日更新时间：下午 4 点至 6 点
    </div>

</main>

<footer>
    &copy; 2026 TeraBox 数据仪表板
</footer>

<script>
const dashboardData = {
    clicks: 12450,
    downloads: 3280,
    earnings: 8750
};

document.getElementById("clickCount").textContent =
    dashboardData.clicks;

document.getElementById("downloadCount").textContent =
    dashboardData.downloads;

document.getElementById("earningCount").textContent =
    "₹" + dashboardData.earnings;
</script>

</body>
</html>
